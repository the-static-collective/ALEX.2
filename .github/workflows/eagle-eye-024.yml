name: ALEX Eagle Eye Public Research 024
on:
  push:
    branches:
      - research/024-eagle-eye-public-discovery
  pull_request:
    paths:
      - 'tools/eagle-eye-024.mjs'
      - 'test/eagle-eye-024.test.mjs'
      - '.github/workflows/eagle-eye-024.yml'
permissions:
  contents: read
jobs:
  public-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulated provider failures and privacy checks
        run: node --test test/eagle-eye-024.test.mjs
      - name: Live public GitHub organization search and source pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import {eagleEye} from './tools/eagle-eye-024.mjs'; const p=await eagleEye({question:'Which source documents preserve witness lineage and provenance?',scopes:{github:true,wikipedia:false,scholarly:false},depth:4},{githubToken:process.env.GITHUB_TOKEN}); console.error(JSON.stringify({status:p.status,catalog:p.catalog,failures:p.failures,sourceDocs:p.source_documents.length,hits:p.hits.length})); if(!p.hits.length||!p.source_documents.length||p.private_sources_accessed)process.exit(1); console.log(JSON.stringify(p,null,2));" > alex024-eagle-eye.json
      - uses: actions/upload-artifact@v4
        with:
          name: alex024-public-eagle-eye-receipt
          path: alex024-eagle-eye.json
          retention-days: 14
